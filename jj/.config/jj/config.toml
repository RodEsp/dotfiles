#:schema https://docs.jj-vcs.dev/latest/config-schema.json

[user]
name = "RodEsp"
email = "1084688+RodEsp@users.noreply.github.com"

[signing]
behavior = "own"
backend = "gpg"
key = "816707F3E5E0C81E"

[revsets]
log = 'all()'

[revset-aliases]
# Make all remote bookmarks (pushed changes) immutable
'immutable_heads()' = "builtin_immutable_heads() | trunk() | tags() | remote_bookmarks()"

[colors]
# Highlight hunks with background
"diff removed token" = { fg = "#d88383", bg = "#493B40", underline = false }
"diff added token" = { fg = "#abbf86", underline = false }

[ui]
default-command = ["log", "-n", "10"]
graph.style = "ascii-large"
merge-editor = "smerge"

[template-aliases]
# See https://docs.jj-vcs.dev/latest/templates/#signature-type for possible values
'format_short_signature(signature)' = 'signature.name()'
# See https://docs.jj-vcs.dev/latest/templates/#timestamp-type for possible values
'format_timestamp(timestamp)' = 'timestamp.local().format("%a %b %-e %Y %k:%M:%S")'

[aliases]
push = ["util", "exec", "--", "jj-hp", "push"]
f = ["git", "fetch"]
e = ["edit"]
d = ["describe", "-m"]
nm = ["new", "main"]

[jj-hooks]
advance-bookmarks = true

[[jj-hooks.setup]]
name = "share node_modules"
run = ["bash", "-c", """
  set -e
  [ -d "$JJ_HOOKS_WORKSPACE" ] || exit 0
  find "$JJ_HOOKS_WORKSPACE" -maxdepth 4 -type d -name node_modules -not -path '*/node_modules/*/node_modules' 2>/dev/null | while read -r src; do
    rel="${src#$JJ_HOOKS_WORKSPACE/}"
    mkdir -p "$(dirname "$rel")"
    cp -al "$src" "$rel" 2>/dev/null || cp -a "$src" "$rel"
  done
"""]
