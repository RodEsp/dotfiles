"$schema" = 'https://starship.rs/config-schema.json'

scan_timeout = 30

format = '''
[┌─\[](green)$directory\] $custom$fill $all
[└─$os ](green)'''

# Custom
[custom.jj]
command = "prompt"#
format = "$output"
ignore_timeout = true
shell = ["starship-jj", "--ignore-working-copy", "starship"]
use_stdin = false
when = true

# Customization
[directory]
read_only = " 󰌾"
format = '[$path](green)[$read_only](red)'
truncation_length = 5
truncation_symbol = '.../'
truncate_to_repo = false

[fill]
symbol = ' '

[os]
disabled = false
format = "[$symbol](green)"

[vcs]
disabled = false
order = ["jujutsu", "git"]

[git_branch]
disabled = true
symbol = " "
format = "$symbol$branch "

[git_commit]
disabled = true
tag_symbol = '  '

[git_status]
disabled = true
format = "([$all_status$ahead_behind]($style) )"
ahead = ' ${count}'
diverged = '󱪕  ${ahead_count} ${behind_count}'
behind = ' ${count}'
conflicted = '[](orange) '
up_to_date = ''
untracked = '[](blue) '
stashed = '[](blue) '
modified = '[󱇧](yellow) '
staged = '[$count󰸩 ](green)'
renamed = ' '
deleted = '🗑 '

# Enabled
[kubernetes]
disabled = false

# Disabled
[character]
disabled = true

[line_break]
disabled = true

[package]
symbol = "󰏗 "
disabled = true

# Nerd Font Symbols
[aws]
symbol = " "
# format = '[$symbol($profile) (\($region\)) (\[$duration\])]($style)'
format = '[$symbol($profile) ($duration)]($style)'
expiration_symbol = ' '

